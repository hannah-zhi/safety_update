<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="安全预警模型状态概览：模型状态、阶段、运行方式与预警类型配置。">
  <title>安全预警模型状态概览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #061016;
      --bg-2: #081924;
      --panel: rgba(12, 28, 40, 0.78);
      --panel-2: rgba(16, 39, 54, 0.9);
      --panel-3: rgba(6, 19, 28, 0.78);
      --line: rgba(122, 211, 255, 0.17);
      --line-strong: rgba(122, 211, 255, 0.38);
      --text: #edf8ff;
      --muted: #9ab0bf;
      --dim: #637785;
      --cyan: #22d8ff;
      --cyan-soft: rgba(34, 216, 255, 0.14);
      --green: #42f2a1;
      --green-soft: rgba(66, 242, 161, 0.14);
      --blue: #62b8ff;
      --blue-soft: rgba(98, 184, 255, 0.14);
      --amber: #ffbd59;
      --amber-soft: rgba(255, 189, 89, 0.14);
      --violet: #b899ff;
      --violet-soft: rgba(184, 153, 255, 0.14);
      --red: #ff7487;
      --red-soft: rgba(255, 116, 135, 0.13);
      --radius: 18px;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      font-family: "Inter", "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; min-width: 0; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 6%, rgba(34, 216, 255, 0.16), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(66, 242, 161, 0.09), transparent 27%),
        linear-gradient(140deg, var(--bg), #071620 48%, #051018 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        linear-gradient(rgba(122, 211, 255, 0.052) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 211, 255, 0.052) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    button, select, input, a { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .page {
      width: min(1600px, calc(100% - 44px));
      margin: 0 auto;
      padding: 28px 0 66px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 760;
      letter-spacing: 0.01em;
      line-height: 1.35;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 11px;
      border: 1px solid var(--line-strong);
      background: linear-gradient(135deg, rgba(34, 216, 255, 0.18), rgba(66, 242, 161, 0.12));
      box-shadow: 0 0 30px rgba(34, 216, 255, 0.16);
    }

    .brand-mark svg { width: 21px; height: 21px; }
    .top-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px rgba(66, 242, 161, 0.7);
    }

    .glass {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(12, 28, 40, 0.84), rgba(7, 17, 26, 0.64));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 16px;
    }

    .section-title-wrap { max-width: 980px; }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--cyan);
      font-size: 14px;
      font-weight: 760;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(26px, 3.2vw, 44px);
      font-weight: 860;
      line-height: 1.18;
      letter-spacing: 0.02em;
    }

    h1::before {
      content: "";
      width: 8px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--cyan), var(--green));
      box-shadow: 0 0 20px rgba(34, 216, 255, 0.36);
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #ccefff;
      background: rgba(255, 255, 255, 0.035);
      font-size: 13px;
      white-space: nowrap;
      transition: 160ms ease;
    }

    .source-link:hover { border-color: var(--line-strong); background: rgba(34, 216, 255, 0.08); }
    .source-link svg { width: 16px; height: 16px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) 1.8fr;
      gap: 14px;
      margin-top: 22px;
    }

    .kpi {
      position: relative;
      min-height: 132px;
      padding: 18px 18px 16px;
      overflow: hidden;
    }

    .kpi::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      right: -42px;
      top: -48px;
      border-radius: 50%;
      background: var(--kpi-soft, var(--cyan-soft));
      filter: blur(4px);
    }

    .kpi-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .kpi-icon {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--kpi-color, var(--cyan));
      background: var(--kpi-soft, var(--cyan-soft));
    }

    .kpi-icon svg { width: 17px; height: 17px; }
    .kpi-value {
      margin-top: 10px;
      color: var(--text);
      font-size: clamp(28px, 3vw, 39px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.02em;
    }

    .kpi-value small { margin-left: 5px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .scenario-kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .scenario-kpi-item { min-height: 58px; padding: 10px 12px; border: 1px solid var(--scenario-border); border-radius: 11px; background: var(--scenario-bg); }
    .scenario-kpi-item span { color: var(--muted); font-size: 13px; }
    .scenario-kpi-item strong { display: block; margin-top: 6px; color: var(--scenario-color); font-size: 22px; line-height: 1; }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .chart-card { padding: 17px 18px; min-height: 270px; }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card-head h2, .table-title h2 { margin: 0; font-size: 17px; line-height: 1.4; }
    .chart-total {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 740;
      white-space: nowrap;
    }

    .status-donuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; height: 100%; }
    .donut-section { min-width: 0; padding: 2px 18px; }
    .donut-section + .donut-section { border-left: 1px solid var(--line); }
    .donut-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .donut-title h2 { margin: 0; font-size: 17px; }
    .donut-content { display: grid; grid-template-columns: 138px minmax(0, 1fr); align-items: center; gap: 15px; padding-top: 10px; }

    .donut {
      position: relative;
      width: 132px;
      height: 132px;
      margin: auto;
      border-radius: 50%;
      background: conic-gradient(var(--green) 0 var(--online-angle, 0deg), rgba(99, 119, 133, 0.38) var(--online-angle, 0deg) 360deg);
      box-shadow: 0 0 34px rgba(66, 242, 161, 0.1);
    }

    .donut::after {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      background: #0a1b26;
      border: 1px solid var(--line);
    }

    .donut-center {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      text-align: center;
    }

    .donut-center strong { font-size: 25px; line-height: 1; }
    .donut-center span { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .legend { display: grid; gap: 9px; }
    .legend-row {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 14px;
    }

    .legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
    .legend-row strong { color: var(--text); font-size: 15px; }
    .bar-chart { display: grid; gap: 12px; }
    .bar-row { display: grid; grid-template-columns: minmax(92px, 126px) 1fr 30px; align-items: center; gap: 10px; }
    .bar-label { overflow: hidden; color: #c9dbe5; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 9px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, 0.055); }
    .bar-fill {
      display: block;
      height: 100%;
      width: var(--bar-width);
      min-width: 3px;
      border-radius: inherit;
      background: var(--bar-color, var(--cyan));
      box-shadow: 0 0 14px rgba(34, 216, 255, 0.28);
      transition: width 240ms ease;
    }

    .bar-value { color: var(--muted); font-size: 14px; text-align: right; }
    .table-card { margin-top: 14px; overflow: hidden; }
    .table-toolbar { padding: 18px; border-bottom: 1px solid var(--line); }
    .table-title { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .table-title-actions { display: flex; align-items: center; gap: 14px; }
    .result-count {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #d9f8ff;
      background: var(--cyan-soft);
      border: 1px solid rgba(34, 216, 255, 0.22);
      font-size: 14px;
      white-space: nowrap;
    }

    .text-btn { border: 0; padding: 5px 0; color: var(--cyan); background: transparent; cursor: pointer; }
    .text-btn:hover { color: #b8f3ff; }

    .table-wrap { width: 100%; overflow: visible; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    thead { position: relative; z-index: 5; }
    th {
      padding: 12px 13px;
      border-bottom: 1px solid var(--line-strong);
      color: #bdefff;
      background: rgba(8, 25, 36, 0.98);
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      white-space: normal;
    }

    th:first-child, td:first-child { padding-left: 18px; }
    th:last-child, td:last-child { padding-right: 18px; }
    .header-filter {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: inherit;
    }
    .header-filter::after { content: "▾"; color: #587787; font-size: 11px; }
    .header-filter.filtered::after, .header-filter.sorted::after { color: var(--cyan); }
    .header-filter.sorted.asc::after { content: "↑"; }
    .header-filter.sorted.desc::after { content: "↓"; }
    tbody > tr.model-row { transition: background 140ms ease; }
    tbody > tr.model-row:hover { background: rgba(34, 216, 255, 0.035); }
    tbody > tr.model-row.open { background: rgba(34, 216, 255, 0.055); }
    td {
      padding: 13px;
      border-bottom: 1px solid rgba(122, 211, 255, 0.085);
      color: #c8dae4;
      font-size: 14px;
      line-height: 1.48;
      vertical-align: middle;
    }

    .expand-cell { width: 44px; }
    .expand-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--cyan);
      background: rgba(34, 216, 255, 0.055);
      cursor: pointer;
      transition: 150ms ease;
    }

    .expand-btn:hover { border-color: var(--line-strong); background: var(--cyan-soft); }
    .expand-btn svg { width: 15px; height: 15px; transition: transform 160ms ease; }
    .expand-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
    .expand-placeholder { width: 30px; height: 30px; display: grid; place-items: center; color: #455d69; }
    .model-name { overflow-wrap: anywhere; }
    .model-name strong { display: block; color: #effbff; font-size: 14px; line-height: 1.45; }
    .english-name { display: block; margin-top: 4px; color: #6f8d9c; font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; }
    .content-count {
      display: inline-flex;
      margin-top: 7px;
      padding: 3px 7px;
      border: 1px solid rgba(34, 216, 255, 0.18);
      border-radius: 999px;
      color: #aeeeff;
      background: rgba(34, 216, 255, 0.06);
      font-size: 12px;
    }

    .pills { display: flex; flex-wrap: wrap; gap: 5px; max-width: 250px; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid rgba(122, 211, 255, 0.14);
      border-radius: 999px;
      color: #b9d1dc;
      background: rgba(255, 255, 255, 0.026);
      font-size: 12px;
      white-space: nowrap;
    }

    .pill.online { color: #9bf7c7; border-color: rgba(66, 242, 161, 0.24); background: var(--green-soft); }
    .pill.offline { color: #9aacb6; border-color: rgba(154, 176, 191, 0.2); background: rgba(154, 176, 191, 0.07); }
    .pill.scenario-cloud { color: #89eaff; border-color: rgba(34,216,255,.26); background: rgba(34,216,255,.08); }
    .pill.scenario-station { color: #8ff4bf; border-color: rgba(66,242,161,.26); background: rgba(66,242,161,.08); }
    .pill.scenario-argus { color: #cfb7ff; border-color: rgba(184,153,255,.28); background: rgba(184,153,255,.09); }
    .pill.ops { color: #a5ddff; border-color: rgba(98, 184, 255, 0.25); background: var(--blue-soft); }
    .pill.iteration { color: #ffd793; border-color: rgba(255, 189, 89, 0.26); background: var(--amber-soft); }
    .pill.development { color: #8cf2ef; border-color: rgba(72, 222, 217, 0.26); background: rgba(72, 222, 217, 0.08); }
    .pill.wait { color: #d5c3ff; border-color: rgba(184, 153, 255, 0.28); background: var(--violet-soft); }
    .pill.retired { color: #ff9baa; border-color: rgba(255, 116, 135, 0.25); background: var(--red-soft); }
    .module-cell { white-space: nowrap; }
    .stage-cell .pills { max-width: none; flex-wrap: nowrap; }
    .stage-cell .pill { flex: 0 0 auto; }
    .category-pill {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 4px 9px;
      border: 1px solid var(--pill-border);
      border-radius: 999px;
      color: var(--pill-color);
      background: var(--pill-bg);
      font-size: 12px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .detail-row td { padding: 0; border-bottom: 1px solid rgba(34, 216, 255, 0.14); background: rgba(4, 16, 24, 0.58); }
    .warning-panel { padding: 18px 22px 21px 62px; }
    .warning-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 13px; }
    .warning-head h3 { margin: 0; color: #e6faff; font-size: 15px; }
    .warning-badge { padding: 6px 9px; border-radius: 999px; color: #aeefff; background: var(--cyan-soft); font-size: 12px; white-space: nowrap; }
    .warning-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .warning-item {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      min-height: 62px;
      padding: 11px 14px;
      border: 1px solid rgba(122, 211, 255, 0.15);
      border-radius: 12px;
      color: #c9dce6;
      background: linear-gradient(110deg, rgba(34, 216, 255, 0.055), rgba(255, 255, 255, 0.02));
      font-size: 14px;
      line-height: 1.5;
    }

    .warning-index {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--cyan);
      background: var(--cyan-soft);
      font-size: 11px;
      font-weight: 750;
    }

    .empty-state { padding: 58px 20px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; margin-bottom: 8px; color: #d8eaf3; font-size: 16px; }
    .column-menu {
      position: fixed;
      z-index: 50;
      width: 250px;
      padding: 10px;
      border: 1px solid rgba(122, 211, 255, 0.24);
      border-radius: 13px;
      background: #0b202d;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.46);
    }
    .menu-sort { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .menu-btn, .menu-action {
      min-height: 34px;
      border: 1px solid rgba(122, 211, 255, 0.16);
      border-radius: 8px;
      color: #bcd2dd;
      background: rgba(255,255,255,.03);
      cursor: pointer;
    }
    .menu-btn:hover, .menu-btn.active { color: #ebfbff; border-color: rgba(34,216,255,.4); background: var(--cyan-soft); }
    .menu-search { width: 100%; height: 36px; margin: 9px 0 7px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: rgba(3,13,20,.7); }
    .menu-options { max-height: 230px; overflow: auto; display: grid; gap: 2px; padding-right: 3px; }
    .menu-option { display: grid; grid-template-columns: 18px 1fr; align-items: center; gap: 8px; min-height: 32px; padding: 5px 4px; color: #c9dbe5; font-size: 13px; }
    .menu-option input { accent-color: var(--cyan); }
    .menu-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }
    .menu-action.primary { color: #00232c; border-color: transparent; background: var(--cyan); font-weight: 750; }
    @media (max-width: 1260px) {
      .dashboard { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 860px) {
      .page { width: min(100% - 24px, 1600px); padding-top: 18px; }
      .topbar, .section-head, .table-title { align-items: flex-start; flex-direction: column; }
      .top-meta { width: 100%; justify-content: space-between; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dashboard { grid-template-columns: 1fr; }
      .status-donuts { grid-template-columns: 1fr; }
      .donut-section + .donut-section { padding-top: 16px; border-top: 1px solid var(--line); border-left: 0; }
      .warning-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .warning-panel { padding-left: 18px; }
      .table-title-actions { flex-wrap: wrap; }
    }

    @media (max-width: 560px) {
      .brand { align-items: flex-start; font-size: 14px; }
      .top-meta { align-items: center; justify-content: flex-start; flex-direction: row; flex-wrap: wrap; }
      h1 { font-size: 27px; }
      h1::before { height: 28px; }
      .kpi-grid, .warning-grid { grid-template-columns: 1fr; }
      .scenario-kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .donut-content { grid-template-columns: 1fr; }
      .legend { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="page" id="top">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="返回顶部">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13.5 10.2 3l1.3 7.1H19L13.8 21l-1.3-7.5H5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </span>
        安全预警模块进展
      </a>
      <div class="top-meta">
        <span class="live-dot" aria-hidden="true"></span>
        <span>数据快照：2026-11-19</span>
        <a class="source-link" href="https://envision-energy.feishu.cn/wiki/O8Hewpqq5i4z0Sk4HGJcUbQHn3g?sheet=95ba18" target="_blank" rel="noreferrer">
          查看飞书源表
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M17 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>

    }

    function renderPills(items, className = "") {
      return `<div class="pills">${items.map((item) => `<span class="pill ${className || stageClass(item)}">${item}</span>`).join("")}</div>`;
    }

    function scenarioClass(scenario) {
      if (scenario === "云端") return "scenario-cloud";
      if (scenario === "站端") return "scenario-station";
      return "scenario-argus";
    }

    function renderScenarioPills(items) {
      return `<div class="pills">${items.map((item) => `<span class="pill ${scenarioClass(item)}">${item}</span>`).join("")}</div>`;
    }

    const categoryColors = {
      "ALL": ["#a9bdc8", "rgba(169,189,200,.08)", "rgba(169,189,200,.22)"],
      "电池系统": ["#65efae", "rgba(66,242,161,.09)", "rgba(66,242,161,.25)"],
      "系统控制与涉网服务": ["#7bc8ff", "rgba(98,184,255,.09)", "rgba(98,184,255,.25)"],
      "环控与热管理": ["#57e5f5", "rgba(34,216,255,.09)", "rgba(34,216,255,.25)"],
      "电气总成": ["#ffd07a", "rgba(255,189,89,.09)", "rgba(255,189,89,.25)"],
      "系统集成": ["#c9adff", "rgba(184,153,255,.1)", "rgba(184,153,255,.26)"],
      "电芯": ["#72f0b6", "rgba(66,242,161,.08)", "rgba(66,242,161,.22)"],
      "Pack": ["#7bc8ff", "rgba(98,184,255,.08)", "rgba(98,184,255,.22)"],
      "BMS": ["#c9adff", "rgba(184,153,255,.09)", "rgba(184,153,255,.24)"],
      "直流环控": ["#57e5f5", "rgba(34,216,255,.08)", "rgba(34,216,255,.22)"],
      "PCS": ["#ffcb6b", "rgba(255,189,89,.08)", "rgba(255,189,89,.22)"],
      "主控配电柜": ["#ff91a1", "rgba(255,116,135,.08)", "rgba(255,116,135,.22)"],
      "变压器": ["#92bfff", "rgba(98,184,255,.08)", "rgba(98,184,255,.22)"],
      "交流电气总成": ["#92bfff", "rgba(98,184,255,.08)", "rgba(98,184,255,.22)"],
      "直流结构总成": ["#d5bdff", "rgba(184,153,255,.08)", "rgba(184,153,255,.22)"]
    };

    function categoryPill(value) {
      const [color, background, border] = categoryColors[value] || ["#b9d1dc", "rgba(255,255,255,.035)", "rgba(122,211,255,.16)"];
      return `<span class="category-pill" style="--pill-color:${color};--pill-bg:${background};--pill-border:${border}">${value}</span>`;
    }

    function renderTable(rows) {
      els.body.innerHTML = rows.map((model) => {
        const expandable = model.warnings.length > 0;
        const open = state.expanded.has(model.id);
        const expandControl = expandable
          ? `<button class="expand-btn" type="button" data-expand="${model.id}" aria-expanded="${open}" aria-label="${open ? "收起" : "展开"}${model.name}的预警类型"><svg viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
          : `<span class="expand-placeholder">—</span>`;
        const detail = open ? `
          <tr class="detail-row">
            <td colspan="10">
              <div class="warning-panel">
                <div class="warning-head">
                  <h3>${model.name} · 预警类型</h3>
                  <span class="warning-badge">${model.warnings.length} 条</span>
                </div>
                <div class="warning-grid">${model.warnings.map((warning, index) => `<div class="warning-item"><span class="warning-index">${String(index + 1).padStart(2, "0")}</span><span>${warning}</span></div>`).join("")}</div>
              </div>
            </td>
          </tr>` : "";
        return `
          <tr class="model-row ${open ? "open" : ""}">
            <td class="expand-cell">${expandControl}</td>
            <td class="model-name"><strong>${model.name}</strong><span class="english-name">${model.english}</span>${expandable ? `<span class="content-count">${model.warnings.length} 条预警类型</span>` : ""}</td>
            <td class="module-cell">${categoryPill(model.module)}</td>
            <td>${categoryPill(model.cbb)}</td>
            <td>${renderScenarioPills(model.scenarios)}</td>
            <td>${renderPills([model.mode], model.mode === "在线" ? "online" : "offline")}</td>
            <td>${model.version}</td>
            <td>${model.accuracy || "—"}</td>
            <td class="stage-cell">${renderPills(model.stages)}</td>
            <td>${model.owner}</td>
          </tr>${detail}`;
      }).join("");
      els.empty.hidden = rows.length > 0;

      els.body.querySelectorAll("[data-expand]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = Number(button.dataset.expand);
          state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
          renderAll();
        });
      });
    }

    function renderKpis(rows) {
      const warningCount = rows.reduce((sum, m) => sum + m.warnings.length, 0);
      const accuracies = rows.filter((m) => m.accuracy).map((m) => Number.parseFloat(m.accuracy));
      const averageAccuracy = accuracies.length ? accuracies.reduce((sum, value) => sum + value, 0) / accuracies.length : null;
      document.getElementById("kpiModels").innerHTML = `${rows.length}<small>个</small>`;
      document.getElementById("kpiWarnings").innerHTML = `${warningCount}<small>类</small>`;
      document.getElementById("kpiAverageAccuracy").innerHTML = averageAccuracy === null ? "—" : `${averageAccuracy.toFixed(1)}<small>%</small>`;
    }

    function renderRunChart(rows) {
      const online = rows.filter((m) => m.mode === "在线").length;
      const offline = rows.filter((m) => m.mode === "离线").length;
      const rate = rows.length ? Math.round(online / rows.length * 100) : 0;
      const donut = document.getElementById("runDonut");
      donut.style.setProperty("--online-angle", `${rate * 3.6}deg`);
      donut.setAttribute("aria-label", `在线 ${online} 个，离线 ${offline} 个，在线率 ${rate}%`);
      document.getElementById("donutRate").textContent = `${rate}%`;
      document.getElementById("runTotal").textContent = `${rows.length} 个模型`;
      document.getElementById("runLegend").innerHTML = `
        <div class="legend-row"><span class="legend-dot" style="--dot:var(--green)"></span><span>在线</span><strong>${online}</strong></div>
        <div class="legend-row"><span class="legend-dot" style="--dot:#637785"></span><span>离线</span><strong>${offline}</strong></div>`;
    }

    function renderModuleChart(rows) {
      const counts = Object.entries(rows.reduce((acc, model) => ((acc[model.module] = (acc[model.module] || 0) + 1), acc), {}))
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh-CN"));
      const max = Math.max(1, ...counts.map(([, value]) => value));
      const colors = ["#22d8ff", "#42f2a1", "#62b8ff", "#ffbd59", "#b899ff", "#ff7487"];
      document.getElementById("moduleTotal").textContent = `${counts.length} 个模块`;
      document.getElementById("moduleChart").innerHTML = counts.length ? counts.map(([label, value], index) => `
        <div class="bar-row" title="${label}：${value} 个模型">
          <span class="bar-label">${label}</span><span class="bar-track"><i class="bar-fill" style="--bar-width:${value / max * 100}%;--bar-color:${colors[index % colors.length]}"></i></span><span class="bar-value">${value}</span>
        </div>`).join("") : `<div class="empty-state">暂无数据</div>`;
    }

    function renderStageChart(rows) {
      const order = ["上线运营中", "模型迭代中", "模型开发中", "待CBB确认反馈", "已下线"];
      const colors = { "上线运营中": "#62b8ff", "模型迭代中": "#ffbd59", "模型开发中": "#48ded9", "待CBB确认反馈": "#b899ff", "已下线": "#ff7487" };
      const counts = order.map((stage) => [stage, rows.filter((model) => model.stages.includes(stage)).length]);
      const total = counts.reduce((sum, [, value]) => sum + value, 0);
      let cursor = 0;
      const segments = counts.filter(([, value]) => value > 0).map(([stage, value]) => {
        const start = total ? cursor / total * 360 : 0;
        cursor += value;
        const end = total ? cursor / total * 360 : 0;
        return `${colors[stage]} ${start}deg ${end}deg`;
      });
      const donut = document.getElementById("stageDonut");
      donut.style.background = segments.length ? `conic-gradient(${segments.join(",")})` : "rgba(99,119,133,.38)";
      donut.setAttribute("aria-label", counts.map(([stage, value]) => `${stage} ${value} 个`).join("，"));
      document.getElementById("stageTotal").textContent = `${rows.length} 个模型`;
      document.getElementById("stageCount").textContent = total;
      document.getElementById("stageLegend").innerHTML = counts.map(([stage, value]) => `
        <div class="legend-row"><span class="legend-dot" style="--dot:${colors[stage]}"></span><span>${stage}</span><strong>${value}</strong></div>`).join("");
    }

    function renderScenarioKpis(rows) {
      const order = ["云端", "站端", "Argus"];
      const colors = {
        "云端": ["#22d8ff", "rgba(34,216,255,.08)", "rgba(34,216,255,.22)"],
        "站端": ["#42f2a1", "rgba(66,242,161,.08)", "rgba(66,242,161,.22)"],
        "Argus": ["#b899ff", "rgba(184,153,255,.08)", "rgba(184,153,255,.22)"]
      };
      document.getElementById("scenarioKpis").innerHTML = order.map((scenario) => {
        const count = rows.filter((model) => model.scenarios.includes(scenario)).length;
        return `<div class="scenario-kpi-item" style="--scenario-color:${colors[scenario][0]};--scenario-bg:${colors[scenario][1]};--scenario-border:${colors[scenario][2]}"><span>${scenario}</span><strong>${count}</strong></div>`;
      }).join("");
    }

    function renderSummary(rows) {
      els.result.textContent = `显示 ${rows.length} / ${models.length} 个模型`;
      const expandableIds = rows.filter((m) => m.warnings.length).map((m) => m.id);
      const allExpanded = expandableIds.length > 0 && expandableIds.every((id) => state.expanded.has(id));
      els.toggleAll.textContent = allExpanded ? "收起全部预警类型" : "展开全部预警类型";
      els.reset.hidden = !state.sortKey && Object.values(state.filters).every((set) => set.size === 0);
    }

    function renderHeaderState() {
      document.querySelectorAll(".header-filter").forEach((button) => {
        const key = button.dataset.column;
        button.classList.toggle("filtered", state.filters[key].size > 0);
        button.classList.toggle("sorted", state.sortKey === key);
        button.classList.toggle("asc", state.sortKey === key && state.sortDir === 1);
        button.classList.toggle("desc", state.sortKey === key && state.sortDir === -1);
      });
    }

    function renderAll() {
      const rows = getFilteredModels();
      renderKpis(rows);
      renderRunChart(rows);
      renderModuleChart(rows);
      renderScenarioKpis(rows);
      renderStageChart(rows);
      renderTable(rows);
      renderSummary(rows);
      renderHeaderState();
    }

    function closeColumnMenu() { els.menu.hidden = true; els.menu.innerHTML = ""; }
    function openColumnMenu(key, anchor) {
      const options = columnOptions(key);
      const current = state.filters[key];
      let draft = current.has("__NONE__") ? new Set() : current.size ? new Set(current) : new Set(options);
      const renderOptions = (query = "") => {
        const visible = options.filter((value) => value.toLowerCase().includes(query.trim().toLowerCase()));
        const list = els.menu.querySelector(".menu-options");
        list.innerHTML = visible.map((value) => `<label class="menu-option"><input type="checkbox" value="${value.replaceAll('"', '&quot;')}" ${draft.has(value) ? "checked" : ""}><span>${value}</span></label>`).join("") || `<div class="menu-option">无匹配项</div>`;
        list.querySelectorAll("input").forEach((input) => input.addEventListener("change", () => input.checked ? draft.add(input.value) : draft.delete(input.value)));
      };
      els.menu.innerHTML = `
        <div class="menu-sort">
          <button class="menu-btn ${state.sortKey === key && state.sortDir === 1 ? "active" : ""}" data-direction="1">↑ 升序</button>
          <button class="menu-btn ${state.sortKey === key && state.sortDir === -1 ? "active" : ""}" data-direction="-1">↓ 降序</button>
        </div>
        <input class="menu-search" type="search" placeholder="搜索${columns[key].label}" aria-label="搜索${columns[key].label}">
        <div class="menu-options"></div>
        <div class="menu-actions"><button class="menu-action" data-select-all>全选</button><button class="menu-action" data-select-none>全不选</button><button class="menu-action primary" data-apply>确定</button></div>`;
      renderOptions();
      els.menu.querySelectorAll("[data-direction]").forEach((button) => button.addEventListener("click", () => {
        state.sortKey = key;
        state.sortDir = Number(button.dataset.direction);
        closeColumnMenu();
        renderAll();
      }));
      els.menu.querySelector(".menu-search").addEventListener("input", (event) => renderOptions(event.target.value));
      els.menu.querySelector("[data-select-all]").addEventListener("click", () => { draft = new Set(options); renderOptions(els.menu.querySelector(".menu-search").value); });
      els.menu.querySelector("[data-select-none]").addEventListener("click", () => { draft = new Set(); renderOptions(els.menu.querySelector(".menu-search").value); });
      els.menu.querySelector("[data-apply]").addEventListener("click", () => {
        state.filters[key] = draft.size === options.length ? new Set() : draft.size === 0 ? new Set(["__NONE__"]) : draft;
        closeColumnMenu();
        renderAll();
      });
      els.menu.hidden = false;
      const rect = anchor.getBoundingClientRect();
      const left = Math.min(rect.left, window.innerWidth - 266);
      const top = Math.min(rect.bottom + 7, window.innerHeight - Math.min(420, els.menu.offsetHeight) - 8);
      els.menu.style.left = `${Math.max(8, left)}px`;
      els.menu.style.top = `${Math.max(8, top)}px`;
    }

    document.querySelectorAll(".header-filter").forEach((button) => button.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!els.menu.hidden && els.menu.dataset.column === button.dataset.column) return closeColumnMenu();
      els.menu.dataset.column = button.dataset.column;
      openColumnMenu(button.dataset.column, button);
    }));
    document.addEventListener("click", (event) => { if (!els.menu.hidden && !els.menu.contains(event.target)) closeColumnMenu(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeColumnMenu(); });
    els.menu.addEventListener("click", (event) => event.stopPropagation());

    els.reset.addEventListener("click", () => {
      Object.keys(state.filters).forEach((key) => state.filters[key] = new Set());
      state.sortKey = null;
      state.sortDir = 1;
      renderAll();
    });

    els.toggleAll.addEventListener("click", () => {
      const rows = getFilteredModels().filter((model) => model.warnings.length);
      const allExpanded = rows.length && rows.every((model) => state.expanded.has(model.id));
      rows.forEach((model) => allExpanded ? state.expanded.delete(model.id) : state.expanded.add(model.id));
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
